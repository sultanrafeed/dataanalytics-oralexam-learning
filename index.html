<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AT3 Defence Study</title>
<meta name="description" content="Learn your AT3 diabetes project topic by topic, then practise the exam questions.">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AT3 Study">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f7f6f2; --surface: #fff; --soft: #efede7; --text: #1d1d1f; --muted: #5c5c63;
  --line: #dcd9d0; --accent: #1f4e79; --accent-soft: #e5ecf3;
  --right: #3d7556; --right-soft: #e6f0ea; --wrong: #a3443b; --wrong-soft: #f6e6e3;
  --r: 12px; --nav: 60px; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 6px) 12px 6px; display: flex; align-items: center; gap: 6px; min-height: 54px; }
header h1 { font-size: 17px; margin: 0; flex: 1; }
.back { min-width: 48px; min-height: 44px; border: 0; background: none; color: var(--accent); font-size: 17px; cursor: pointer; text-align: left; }
main { max-width: 40em; margin: 0 auto; padding: 16px 16px calc(var(--nav) + env(safe-area-inset-bottom) + 30px); }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav a { flex: 1; min-height: var(--nav); display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; text-align: center; }
nav a[aria-current] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
@media (min-width: 900px) {
  nav { top: 0; right: auto; width: 210px; flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding-top: 16px; }
  nav a { flex: none; justify-content: flex-start; padding: 0 22px; min-height: 50px; font-size: 16px; }
  nav a[aria-current] { box-shadow: inset 4px 0 0 var(--accent); background: var(--accent-soft); }
  header { margin-left: 210px; } main { padding-bottom: 40px; }
  body > main { margin-left: max(226px, calc(210px + (100vw - 210px - 40em) / 2)); }
}

h2 { font-size: 26px; line-height: 1.25; margin: 4px 0 8px; }
h3 { font-size: 20px; margin: 26px 0 8px; }
p { margin: 0 0 10px; }
ul { margin: 0 0 10px; padding-left: 22px; } li { margin-bottom: 6px; }
.muted { color: var(--muted); } .small { font-size: 15px; }
.kicker { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 0 0 12px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px 4px; margin: 0 0 12px; border-left: 5px solid var(--line); }
.sec .lbl { display: block; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.sec.what { border-left-color: #8a8a91; } .sec.why { border-left-color: var(--accent); } .sec.got { border-left-color: var(--right); }
.sec.show { border-left-color: #6b5220; } .sec.say { border-left-color: var(--accent); background: var(--accent-soft); } .sec.rem { border-left-color: #8a6d2f; background: #f7f1e3; }
.example { font-style: italic; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 18px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
.btn.light { background: var(--surface); color: var(--accent); }
.btn.right { background: var(--right); border-color: var(--right); } .btn.wrong { background: var(--wrong); border-color: var(--wrong); }
.btn.full { width: 100%; }
.row { display: flex; gap: 8px; margin: 12px 0; } .row > .btn { flex: 1; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; text-decoration: none; color: var(--text); }
.item .grow { flex: 1; }
.tag { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 12px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--right-soft); color: var(--right); } .tag.again { background: var(--wrong-soft); color: var(--wrong); }
.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
pre.code { background: #fbfaf7; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; margin: 6px 0 10px; }
details { margin: 4px 0 10px; } summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--accent); font-weight: 600; }
.notes li { font-size: 15px; } .notes code { font-size: 13px; background: var(--soft); padding: 1px 4px; border-radius: 4px; }
.q { font-size: 20px; font-weight: 600; line-height: 1.4; }
.timer { font: 600 40px/1 ui-monospace, Menlo, monospace; text-align: center; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; font-size: 15px; } td { border-bottom: 1px solid var(--line); padding: 7px 4px; vertical-align: top; } td:first-child { color: var(--muted); width: 38%; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<header><button class="back" id="back" hidden aria-label="Back">&lsaquo; Back</button><h1 id="title">AT3 Defence Study</h1></header>
<nav id="nav" aria-label="Main">
  <a href="#/" data-tab="home">Home</a>
  <a href="#/topics" data-tab="topics">Topics</a>
  <a href="#/exam" data-tab="exam">Exam Qs</a>
  <a href="#/test" data-tab="test">Test yourself</a>
</nav>
<main id="main" tabindex="-1"></main>

<script>var CONTENT = window.CONTENT || (window.CONTENT = {});</script>
<script src="content-topics.js"></script>
<script src="content-practice.js"></script>
<script src="content-code.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CONTENT, TOPICS = C.topics || [], GROUPS = C.groups || [], EXAM = C.practice || [], STORY = C.story, CODE = C.code || [], NUMBERS = C.numbers || [];
  var KEY = 'at3-study-simple-v1', ANSWER_SECONDS = 40, STORY_SECONDS = 90, TEST_ROUND = 10;

  /* ---------- helpers ---------- */
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function fmt(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function list(arr) { arr = [].concat(arr || []); return arr.length > 1 ? '<ul>' + arr.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul>' : '<p>' + fmt(arr[0] || '') + '</p>'; }
  function sec(cls, label, html) { return '<section class="sec ' + cls + '"><span class="lbl">' + label + '</span>' + html + '</section>'; }
  function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function mmss(ms) { var s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function bar(f) { return '<div class="bar" role="progressbar" aria-valuenow="' + Math.round(f * 100) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + (f * 100).toFixed(1) + '%"></i></div>'; }
  function cellsText(c) { return c && c.length ? (c.length > 1 ? 'Cells ' : 'Cell ') + c.join(', ') : ''; }

  /* ---------- saved progress (try/catch so the app still works if storage is blocked) ---------- */
  function fresh() { return { topics: {}, exam: {}, test: {} }; }
  var S = fresh();
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); for (var k in p) S[k] = p[k]; } } catch (e) { /* storage blocked */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } }

  /* ---------- speech + timer (timer uses timestamps, so it stays right if iOS pauses the page) ---------- */
  var canSpeak = 'speechSynthesis' in window;
  function speak(t) { if (!canSpeak) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t.replace(/\*\*/g, '')); u.rate = 0.95; speechSynthesis.speak(u); } catch (e) { /* ignore */ } }
  var stops = [];
  function countdown(sec, el, done) {
    var end = Date.now() + sec * 1000, iv;
    function tick() { var left = Math.max(0, end - Date.now()); el.textContent = mmss(left); if (left <= 0) { stop(); done(); } }
    function stop() { clearInterval(iv); document.removeEventListener('visibilitychange', tick); }
    iv = setInterval(tick, 250); document.addEventListener('visibilitychange', tick); tick(); stops.push(stop); return stop;
  }

  /* ---------- pages ---------- */
  var P = {};
  function nextTopic() { for (var i = 0; i < TOPICS.length; i++) if (S.topics[TOPICS[i].id] !== 'ok') return TOPICS[i]; return null; }

  P.home = function () {
    var done = TOPICS.filter(function (t) { return S.topics[t.id] === 'ok'; }).length, nt = nextTopic();
    var nailed = EXAM.filter(function (q) { return S.exam[q.id] === 'ok'; }).length;
    return { title: 'AT3 Defence Study', html:
      '<h2>Learn your project, then practise.</h2>' +
      '<p class="muted">Every topic answers: what is it, why did I use it, what did I get, and how do I say it.</p>' +
      (nt ? '<a class="btn full" href="#/topic/' + nt.id + '">Next topic: ' + esc(nt.title) + '</a>' : '<a class="btn full" href="#/exam">All topics done. Practise the exam questions</a>') +
      '<p class="small" style="margin-top:10px">Topics understood: ' + done + ' of ' + TOPICS.length + '</p>' + bar(TOPICS.length ? done / TOPICS.length : 0) +
      '<p class="small">Exam questions nailed: ' + nailed + ' of ' + EXAM.length + '</p>' + bar(EXAM.length ? nailed / EXAM.length : 0) +
      '<h3>How to answer any question</h3><div class="card"><p><strong>1. What</strong>: the direct answer, 1 sentence.<br><strong>2. Evidence</strong>: a number and where it is in the notebook.<br><strong>3. Why</strong>: the reason or trade-off, 1 to 2 sentences.</p><p class="small muted" style="margin:0">1 + 2 = Good (30). Add 3 = Excellent (40). About 40 seconds, then stop.</p></div>' +
      '<a class="item" href="#/story"><span class="grow"><strong>My 90-second opening</strong><br><span class="small muted">Say this first in the exam</span></span>&rsaquo;</a>' +
      '<a class="item" href="#/numbers"><span class="grow"><strong>Numbers to know</strong><br><span class="small muted">All the key results on one page</span></span>&rsaquo;</a>' +
      '<h3>Reset</h3><button class="btn light" id="reset">Reset all progress</button>',
      after: function (m) { $('#reset', m).onclick = function () { if (confirm('Reset all progress? This cannot be undone.')) { S = fresh(); save(); render(); } }; } };
  };

  P.topics = function () {
    return { title: 'Topics', html: '<h2>Topics</h2><p class="muted">Work from top to bottom. Mark a topic "I understand" when you can explain it out loud.</p>' +
      GROUPS.map(function (g) {
        return '<h3>' + esc(g.title) + '</h3>' + TOPICS.filter(function (t) { return t.group === g.id; }).map(function (t) {
          var st = S.topics[t.id];
          return '<a class="item" href="#/topic/' + t.id + '"><span class="grow">' + esc(t.title) + '</span>' + (st === 'ok' ? '<span class="tag ok">Understood</span>' : st === 'again' ? '<span class="tag again">Review</span>' : '') + '</a>';
        }).join('');
      }).join('') };
  };

  P.topic = function (id) {
    var i = -1; TOPICS.forEach(function (t, k) { if (t.id === id) i = k; });
    if (i < 0) return P.missing();
    var t = TOPICS[i], prev = TOPICS[i - 1], next = TOPICS[i + 1], sh = t.show || {}, step = sh.code ? byId(CODE, sh.code) : null;
    var code = step ? '<pre class="code" aria-label="Notebook code">' + step.lines.map(function (l) { return esc(l.c); }).join('\n') + '</pre>' +
      '<details><summary>Explain the code line by line</summary><ul class="notes">' + step.lines.filter(function (l) { return l.n; }).map(function (l) { var c = l.c.trim(); return '<li><code>' + esc(c.slice(0, 48)) + (c.length > 48 ? '…' : '') + '</code><br>' + fmt(l.n) + '</li>'; }).join('') + '</ul></details>' : '';
    var checks = (t.check || []).map(function (c, k) {
      return '<div class="card"><p><strong>' + fmt(c.q) + '</strong></p><button class="btn light full" data-reveal="' + k + '">Say it out loud, then tap to check</button><p data-ans="' + k + '" hidden style="margin-top:10px">' + fmt(c.a) + '</p></div>';
    }).join('');
    return { title: t.title, back: '#/topics', html:
      '<div class="kicker">' + esc((byId(GROUPS, t.group) || {}).title || '') + '</div><h2>' + esc(t.title) + '</h2>' +
      sec('what', 'What is it?', list(t.what) + (t.example ? '<p class="example">Example: ' + fmt(t.example) + '</p>' : '')) +
      sec('why', 'Why did I use it?', list(t.why)) +
      sec('got', 'What did I get?', list(t.got)) +
      sec('show', 'Show it in the notebook', (cellsText(sh.cells) ? '<p><strong>' + cellsText(sh.cells) + '</strong></p>' : '') + code + (sh.point ? '<p>Point at: ' + fmt(sh.point) + '</p>' : '')) +
      sec('say', 'Say it in the exam', '<p>' + fmt(t.say) + '</p>' + (canSpeak ? '<p><button class="btn light" id="listen">Listen</button></p>' : '')) +
      sec('rem', 'Remember', '<p><strong>' + fmt(t.remember) + '</strong></p>') +
      '<h3>Check yourself</h3>' + checks +
      '<div class="row"><button class="btn right" data-mark="ok">I understand</button><button class="btn wrong" data-mark="again">Review later</button></div>' +
      '<div class="row">' + (prev ? '<a class="btn light" href="#/topic/' + prev.id + '">&lsaquo; Previous</a>' : '') + (next ? '<a class="btn light" href="#/topic/' + next.id + '">Next &rsaquo;</a>' : '') + '</div>',
      after: function (m) {
        var ls = $('#listen', m); if (ls) ls.onclick = function () { speak(t.say); };
        $$('[data-reveal]', m).forEach(function (b) { b.onclick = function () { $('[data-ans="' + b.dataset.reveal + '"]', m).hidden = false; b.hidden = true; }; });
        $$('[data-mark]', m).forEach(function (b) { b.onclick = function () { S.topics[t.id] = b.dataset.mark; save(); location.hash = b.dataset.mark === 'ok' && next ? '#/topic/' + next.id : '#/topics'; }; });
      } };
  };

  var GROUP_NAMES = { official: 'The 5 official questions', followup: 'Follow-up questions', at2: 'AT2 questions' };
  P.exam = function () {
    return { title: 'Exam questions', html: '<h2>Exam questions</h2><p class="muted">Read the question, answer out loud (about 40 seconds), then check the model answer.</p>' +
      Object.keys(GROUP_NAMES).map(function (g) {
        return '<h3>' + GROUP_NAMES[g] + '</h3>' + EXAM.filter(function (q) { return q.group === g; }).map(function (q) {
          var st = S.exam[q.id];
          return '<a class="item" href="#/q/' + q.id + '"><span class="grow">' + fmt(q.q) + '</span>' + (st === 'ok' ? '<span class="tag ok">Nailed</span>' : st === 'again' ? '<span class="tag again">Practise</span>' : '') + '</a>';
        }).join('');
      }).join('') };
  };

  P.question = function (id) {
    var i = -1; EXAM.forEach(function (q, k) { if (q.id === id) i = k; });
    if (i < 0) return P.missing();
    var q = EXAM[i], next = EXAM[i + 1], sh = q.show || {}, topic = byId(TOPICS, q.topic);
    var where = cellsText(sh.cells) ? '<strong>' + cellsText(sh.cells) + '</strong>' + (sh.text ? ': ' + fmt(sh.text) : '') : (sh.text ? fmt(sh.text) : 'No cell. Answer from memory.');
    return { title: GROUP_NAMES[q.group], back: '#/exam', html:
      '<div class="card"><p class="q" style="margin:0">' + fmt(q.q) + '</p></div>' +
      '<div class="card"><div class="timer" id="tm">' + mmss(ANSWER_SECONDS * 1000) + '</div><button class="btn light full" id="go">Start 40 seconds and answer out loud</button></div>' +
      '<button class="btn full" id="show">Show the model answer</button>' +
      '<div id="ans" hidden style="margin-top:12px">' +
        sec('say', 'Good answer (What + Evidence)', '<p>' + fmt(q.good) + '</p>') +
        sec('why', 'Excellent add-on (Why)', '<p>' + fmt(q.excellent) + '</p>') +
        (q.short ? sec('rem', 'Short version', '<p>' + fmt(q.short) + '</p>') : '') +
        sec('show', 'Point at', '<p>' + where + '</p>') +
        (canSpeak ? '<button class="btn light full" id="listen">Listen to the answer</button>' : '') +
        '<div class="row"><button class="btn right" data-mark="ok">Nailed it</button><button class="btn wrong" data-mark="again">Practise again</button></div>' +
        (topic ? '<p class="small">Learn the topic: <a href="#/topic/' + topic.id + '">' + esc(topic.title) + '</a></p>' : '') +
      '</div>',
      after: function (m) {
        var stop = null;
        $('#go', m).onclick = function (e) { e.target.hidden = true; stop = countdown(ANSWER_SECONDS, $('#tm', m), function () { $('#show', m).click(); }); };
        $('#show', m).onclick = function (e) { if (stop) stop(); e.target.hidden = true; $('#ans', m).hidden = false; };
        var ls = $('#listen', m); if (ls) ls.onclick = function () { speak(q.good + ' ' + q.excellent); };
        $$('[data-mark]', m).forEach(function (b) { b.onclick = function () { S.exam[q.id] = b.dataset.mark; save(); location.hash = next ? '#/q/' + next.id : '#/exam'; }; });
      } };
  };

  /* Test yourself: 10 quick questions from the topics' "Check yourself". Misses come back first. */
  var round = null;
  function allChecks() { var out = []; TOPICS.forEach(function (t) { (t.check || []).forEach(function (c, k) { out.push({ id: t.id + ':' + k, topic: t, q: c.q, a: c.a }); }); }); return out; }
  P.test = function () {
    if (!round) {
      var all = allChecks();
      var miss = shuffle(all.filter(function (x) { var s = S.test[x.id]; return s && s.miss > s.hit; }));
      var unseen = shuffle(all.filter(function (x) { return !S.test[x.id]; }));
      var rest = shuffle(all.filter(function (x) { return miss.indexOf(x) < 0 && unseen.indexOf(x) < 0; }));
      round = { qs: miss.concat(unseen, rest).slice(0, TEST_ROUND), i: 0, knew: 0, shown: false };
    }
    var r = round;
    if (r.i >= r.qs.length) {
      var missed = r.qs.length - r.knew;
      return { title: 'Test yourself', html: '<h2>' + r.knew + ' of ' + r.qs.length + ' known</h2>' +
        '<div class="card"><p>' + (missed ? 'You missed ' + missed + '. They come back first next time.' : 'No misses this round.') + '</p></div>' +
        '<button class="btn full" id="again">Another 10 questions</button>',
        after: function (m) { $('#again', m).onclick = function () { round = null; render(); }; } };
    }
    var x = r.qs[r.i];
    return { title: 'Test yourself', html:
      '<p class="small muted">Question ' + (r.i + 1) + ' of ' + r.qs.length + ' · ' + esc(x.topic.title) + '</p>' + bar(r.i / r.qs.length) +
      '<div class="card"><p class="q" style="margin:0">' + fmt(x.q) + '</p></div>' +
      (r.shown ? '<div class="card"><p style="margin:0">' + fmt(x.a) + '</p></div><div class="row"><button class="btn wrong" data-k="0">Didn\'t know</button><button class="btn right" data-k="1">Knew it</button></div><p class="small"><a href="#/topic/' + x.topic.id + '">Open the topic</a></p>'
        : '<button class="btn full" id="flip">Say it out loud, then show the answer</button>'),
      after: function (m) {
        var f = $('#flip', m); if (f) f.onclick = function () { r.shown = true; render(); };
        $$('[data-k]', m).forEach(function (b) { b.onclick = function () {
          var s = S.test[x.id] || { hit: 0, miss: 0 }; if (b.dataset.k === '1') { s.hit++; r.knew++; } else s.miss++;
          S.test[x.id] = s; save(); r.i++; r.shown = false; render(); }; });
      } };
  };

  var hideScript = false;
  P.story = function () {
    var script = STORY ? STORY.blocks.map(function (b) { return '<p>' + fmt(b.text) + '</p>'; }).join('') + '<p><strong>' + fmt(STORY.closing) + '</strong></p>' : '';
    return { title: 'My 90-second opening', back: '#/', html: '<h2>My 90-second opening</h2><p class="muted">Say this first in the exam, scrolling the notebook as you speak.</p>' +
      (hideScript ? '<div class="card muted">Script hidden. Say it from memory, then show it to check.</div>' : '<div class="card">' + script + '</div>') +
      '<div class="row"><button class="btn light" id="hide">' + (hideScript ? 'Show the script' : 'Hide the script') + '</button>' + (canSpeak ? '<button class="btn light" id="listen">Listen</button>' : '') + '</div>' +
      '<div class="card"><div class="timer" id="tm">' + mmss(STORY_SECONDS * 1000) + '</div><button class="btn full" id="go">Start 90 seconds</button></div>' +
      (STORY && STORY.note ? '<p class="small muted">' + fmt(STORY.note) + '</p>' : ''),
      after: function (m) {
        $('#hide', m).onclick = function () { hideScript = !hideScript; render(); };
        var ls = $('#listen', m); if (ls) ls.onclick = function () { speak(STORY.blocks.map(function (b) { return b.text; }).join(' ') + ' ' + STORY.closing); };
        $('#go', m).onclick = function (e) { e.target.hidden = true; countdown(STORY_SECONDS, $('#tm', m), function () { $('#tm', m).textContent = 'Time'; }); };
      } };
  };

  P.numbers = function () {
    return { title: 'Numbers to know', back: '#/', html: '<h2>Numbers to know</h2><p class="muted">In the order of your story. Say them to 3 decimals.</p><div class="card"><table>' +
      NUMBERS.map(function (n) { return '<tr><td>' + esc(n[0]) + '</td><td>' + fmt(n[1]) + '</td></tr>'; }).join('') + '</table></div>' };
  };

  P.missing = function () { return { title: 'Not found', back: '#/', html: '<p>That page does not exist. <a href="#/">Go home</a>.</p>' }; };

  /* ---------- router ---------- */
  var last = null;
  function render() {
    stops.forEach(function (f) { f(); }); stops = [];
    if (canSpeak) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    var h = location.hash.replace(/^#\/?/, ''), parts = h.split('/'), a = parts[0], b = parts[1], tab = 'home', page;
    if (a !== 'test') round = null;   // leaving Test yourself starts a new round next time
    if (!a) page = P.home();
    else if (a === 'topics') { page = P.topics(); tab = 'topics'; }
    else if (a === 'topic') { page = P.topic(b); tab = 'topics'; }
    else if (a === 'exam') { page = P.exam(); tab = 'exam'; }
    else if (a === 'q') { page = P.question(b); tab = 'exam'; }
    else if (a === 'test') { page = P.test(); tab = 'test'; }
    else if (a === 'story') page = P.story();
    else if (a === 'numbers') page = P.numbers();
    else page = P.missing();
    document.title = page.title + ' · AT3 Study';
    $('#title').textContent = page.title;
    var back = $('#back'); back.hidden = !page.back; back.onclick = page.back ? function () { location.hash = page.back; } : null;
    var m = $('#main'); m.innerHTML = page.html;
    $$('#nav a').forEach(function (n) { if (n.dataset.tab === tab) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current'); });
    if (h !== last) { window.scrollTo(0, 0); m.focus({ preventScroll: true }); }
    last = h;
    if (page.after) page.after(m);
  }
  window.addEventListener('hashchange', render);
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>

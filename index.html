<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AT3 Defence Study</title>
<meta name="description" content="Personal study app for the AT3 oral defence in 32130 Fundamentals of Data Analytics.">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AT3 Study">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface-2: #efede7;
  --text: #1d1d1f;
  --muted: #5c5c63;
  --line: #dcd9d0;
  --accent: #1f4e79;          /* ink blue, 8.6:1 on white */
  --accent-soft: #e5ecf3;
  --right: #3d7556;
  --right-soft: #e6f0ea;
  --wrong: #a3443b;
  --wrong-soft: #f6e6e3;
  --radius: 10px;
  --nav-h: 60px;
  --side-w: 220px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  touch-action: manipulation;
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
main:focus, main:focus-visible { outline: none; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 99; }

/* ---------- layout ---------- */
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display: flex; align-items: center; gap: 8px; min-height: 56px;
}
header.top h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 600; line-height: 1.3; }
.backlink { min-width: 48px; min-height: 48px; display: inline-flex; align-items: center; background: none; border: 0; color: var(--accent); font-size: 17px; cursor: pointer; padding: 0 4px; }
main { max-width: 40em; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 32px); }
nav.main {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
  border-top: 1px solid var(--line); display: flex;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
nav.main a { flex: 1; min-height: var(--nav-h); display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; text-align: center; padding: 0 2px; }
nav.main a[aria-current="page"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 3px 0 var(--accent); }
nav.main a.side-only { display: none; }
@media (min-width: 900px) {
  nav.main { top: 0; right: auto; width: var(--side-w); flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 20px 0; }
  nav.main a, nav.main a.side-only { display: flex; flex: none; justify-content: flex-start; padding: 0 24px; font-size: 16px; min-height: 48px; }
  nav.main a[aria-current="page"] { box-shadow: inset 4px 0 0 var(--accent); background: var(--accent-soft); }
  nav.main .brand { display: block; padding: 0 24px 16px; font-weight: 700; color: var(--text); }
  header.top, main { margin-left: var(--side-w); }
  main { margin-left: max(var(--side-w), calc(var(--side-w) + (100vw - var(--side-w) - 40em) / 2 - 16px)); padding-bottom: 48px; }
}
nav.main .brand { display: none; }

/* ---------- type and blocks ---------- */
h2 { font-size: 26px; line-height: 1.25; margin: 4px 0 8px; }
h3 { font-size: 20px; line-height: 1.3; margin: 24px 0 8px; }
p { margin: 0 0 12px; }
ul, ol { margin: 0 0 12px; padding-left: 22px; }
li { margin-bottom: 4px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 0 0 12px; }
.block { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); padding: 12px 16px 4px; margin: 0 0 12px; }
.block .label { display: block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.block.k-plain { border-left-color: #8a8a91; }
.block.k-project { border-left-color: var(--accent); }
.block.k-say { border-left-color: var(--accent); background: var(--accent-soft); }
.block.k-remember { border-left-color: #8a6d2f; }
.block.k-point { border-left-color: #5c5c63; }
.block.k-trap { border-left-color: var(--wrong); }
.block.k-recall { border-left-color: var(--right); }
.kicker { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
table.t { width: 100%; border-collapse: collapse; font-size: 15px; margin: 4px 0 12px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; }
table.t th { font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
code.inline { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 15px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 18px; border-radius: var(--radius); border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; line-height: 1.3; }
.btn.secondary { background: var(--surface); color: var(--accent); }
.btn.plain { background: var(--surface); color: var(--text); border-color: var(--line); }
.btn.right { background: var(--right); border-color: var(--right); }
.btn.wrong { background: var(--wrong); border-color: var(--wrong); }
.btn.block-w { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.row > .btn { flex: 1 1 140px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.chip { min-height: 48px; padding: 8px 14px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.listbtn { display: flex; width: 100%; text-align: left; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; text-decoration: none; color: var(--text); }
.listbtn .grow { flex: 1; }
.listbtn .meta { font-size: 14px; color: var(--muted); white-space: nowrap; }
.tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 8px; border-radius: 12px; background: var(--surface-2); color: var(--muted); }
.tag.got, .tag.excellent { background: var(--right-soft); color: var(--right); }
.tag.review, .tag.missed { background: var(--wrong-soft); color: var(--wrong); }
.tag.good { background: var(--accent-soft); color: var(--accent); }
.tag.priority { background: #f3ead6; color: #6b5220; }
input[type="search"] { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
.check { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 52px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 8px; cursor: pointer; text-align: left; }
.check .box { width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 5px; flex: none; position: relative; }
.check[aria-pressed="true"] .box { background: var(--right); border-color: var(--right); }
.check[aria-pressed="true"] .box::after { content: ""; position: absolute; left: 6px; top: 1px; width: 6px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
.status { padding: 10px 14px; border-radius: var(--radius); margin: 8px 0 12px; background: var(--surface-2); }
.status.right { background: var(--right-soft); color: #234a35; }
.status.wrong { background: var(--wrong-soft); color: #6d2a23; }

/* progress bars (motion allowed) */
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
.bar.warn > i { background: var(--wrong); }

/* timer */
.timer { font: 600 48px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-align: center; margin: 8px 0 4px; }
.timer.low { color: var(--wrong); }

/* flashcard flip (motion allowed) */
.flip { perspective: 1200px; margin: 8px 0 12px; }
.flip-inner { position: relative; min-height: 280px; transition: transform .45s ease; transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; overflow: auto; display: flex; flex-direction: column; }
.face.back { transform: rotateY(180deg); }
.face .facelabel { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.face .q { font-size: 21px; font-weight: 600; line-height: 1.4; margin: auto 0; }
.flipbtn { width: 100%; }
.blank-gap { display: inline-block; min-width: 4em; border-bottom: 2px solid var(--accent); }
.hl { background: #f3ead6; padding: 0 3px; border-radius: 3px; font-weight: 700; }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.contrast > div { background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: 16px; }
.contrast b { display: block; margin-bottom: 4px; }
@media (max-width: 420px) { .contrast { grid-template-columns: 1fr; } }
.boxes { display: flex; gap: 4px; margin-top: 8px; }
.boxes i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.boxes i.on { background: var(--accent); }

/* quiz */
.opt { display: block; width: 100%; min-height: 52px; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.4; }
.opt.is-right { border-color: var(--right); background: var(--right-soft); }
.opt.is-wrong { border-color: var(--wrong); background: var(--wrong-soft); }

/* story gaps */
.gap { display: inline; min-height: 0; padding: 0 6px; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); color: transparent; border-radius: 3px; cursor: pointer; font-size: inherit; line-height: inherit; }
.gap.shown { color: var(--accent); background: transparent; font-weight: 700; }
.script p { font-size: 19px; }

/* code */
pre.code { background: #fbfaf7; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 0; overflow-x: auto; font-size: 14px; line-height: 1.55; margin: 4px 0 12px; }
pre.code .ln { display: block; padding: 0 12px; white-space: pre; }
pre.code button.ln { width: 100%; text-align: left; background: none; border: 0; font: inherit; cursor: pointer; min-height: 32px; }
pre.code button.ln[aria-expanded="true"] { background: var(--accent-soft); }
pre.code .note { display: block; white-space: normal; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; background: var(--accent-soft); color: var(--text); padding: 6px 12px 8px 24px; border-left: 3px solid var(--accent); }
.tk-com { color: #6b6b72; font-style: italic; }
.tk-str { color: #7a4b12; }
.tk-kw { color: #1f4e79; font-weight: 700; }
.tk-num { color: #8a2f5a; }
.tk-fn { color: #2d6b47; }

@media (prefers-reduced-motion: reduce) {
  .flip-inner, .bar > i { transition: none; }
}
</style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<header class="top">
  <button class="backlink" id="back" hidden aria-label="Back">&lsaquo; Back</button>
  <h1 id="title">AT3 Defence Study</h1>
</header>
<nav class="main" id="nav" aria-label="Main"></nav>
<main id="main" tabindex="-1"></main>

<script>
/* ============================================================
   CONFIG: settings you may change. No game features.
   ============================================================ */
var CONFIG = {
  storageKey: 'at3-defence-study-v1',
  examTitle: 'AT3 Oral Defence',
  newCardsPerSession: 10,          // new flashcards introduced per session
  againAfter: 4,                   // "Didn't know" cards return after this many other cards
  boxWeights: [8, 4, 2, 1, 0.5],   // draw weights for boxes 1 to 5 (box 5 = mastered)
  quizRoundSize: 10,
  answerSeconds: 40,               // Answer practice and Mock defence
  storySeconds: 90,
  mockSize: 8,
  marksPerRating: { excellent: 40, good: 30, missed: 0 },  // self-rated estimate only
  longAnswerWords: 80              // answers longer than this show their short version
};

/* ============================================================
   CONTENT is filled by the five content files.
   Shapes expected (every item has a stable id):
   CONTENT.home     = { rubric:[{mark,name,sees,evidence}], plan:[{day,text}] }
   CONTENT.parts    = [{ id, title }]
   CONTENT.learn    = [{ id, part, title, plain:[items], project:[items], say:string|[items],
                         remember:[items], point:{cells:[n], text}, trap?:string,
                         recall:[{q,a}] (3) }]
                      items: "text" | {list:[...]} | {table:{head:[...], rows:[[...]]}}
                      inline marks: **bold**, `code`
   CONTENT.glossary = [{ id, term, plain, lesson? }]
   CONTENT.cards    = [{ id, lesson, cat:'numbers'|'models'|'concepts'|'prep'|'at2'|'rules',
                         type:'qa'|'blank'|'contrast'|'sayit', priority?:true,
                         q, a }]  blank: text with {{answer}} instead of q/a
                                  contrast: q, pair:[{name,text},{name,text}]
                                  sayit: q, what, evidence, why
   CONTENT.quiz     = [{ id, set:'at3'|'at2', kind, q, options:[correct, closest wrong, ...],
                         why, near, section, lesson }]
   CONTENT.story    = { intro, blocks:[{id, text, plain, gaps:[...]}], closing, note }
   CONTENT.practice = [{ id, group:'official'|'followup'|'at2', n, q, good, excellent,
                         short?, show:{cells:[n], text}, lesson }]
   CONTENT.code     = [{ id, title, cells:[n], section, lines:[{c, n?}], plain, say,
                         output, lesson? }]
   ============================================================ */
var CONTENT = window.CONTENT || (window.CONTENT = {});
</script>
<script src="content-learn.js"></script>
<script src="content-cards.js"></script>
<script src="content-quiz.js"></script>
<script src="content-practice.js"></script>
<script src="content-code.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CONTENT;
  var LEARN = C.learn || [], PARTS = C.parts || [], CARDS = C.cards || [], QUIZ = C.quiz || [],
      PRACTICE = C.practice || [], CODE = C.code || [], GLOSSARY = C.glossary || [],
      STORY = C.story || null, HOME = C.home || { rubric: [], plan: [] };

  /* ---------------- helpers ---------------- */
  function $(s, el) { return (el || document).querySelector(s); }
  function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  // inline marks after escaping: **bold** and `code`
  function fmt(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  }
  function items(arr) {
    if (arr == null) return '';
    if (!Array.isArray(arr)) arr = [arr];
    return arr.map(function (it) {
      if (typeof it === 'string') return '<p>' + fmt(it) + '</p>';
      if (it.list) return '<ul>' + it.list.map(function (li) { return '<li>' + fmt(li) + '</li>'; }).join('') + '</ul>';
      if (it.table) return table(it.table);
      return '';
    }).join('');
  }
  function table(t) {
    return '<div class="tablewrap"><table class="t">' + (t.caption ? '<caption class="muted small" style="text-align:left">' + fmt(t.caption) + '</caption>' : '') +
      '<thead><tr>' + t.head.map(function (h) { return '<th scope="col">' + fmt(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      t.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + fmt(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>';
  }
  function plainText(arr) {
    if (arr == null) return '';
    if (!Array.isArray(arr)) arr = [arr];
    return arr.map(function (it) { return typeof it === 'string' ? it : it.list ? it.list.join('. ') : ''; }).join(' ').replace(/\*\*|`/g, '');
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function words(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }
  function mmss(ms) { var s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function block(kind, label, html) { return '<section class="block k-' + kind + '" aria-label="' + esc(label) + '"><span class="label">' + esc(label) + '</span>' + html + '</section>'; }
  function cellText(cells) { return (cells || []).length ? (cells.length > 1 ? 'Cells ' : 'Cell ') + cells.join(', ') : ''; }
  function codeStepForCell(cell) { for (var i = 0; i < CODE.length; i++) if ((CODE[i].cells || []).indexOf(cell) >= 0) return i; return -1; }

  /* ---------------- storage ---------------- */
  var storageOK = true;
  function blank() { return { lessons: {}, recall: {}, cards: {}, quiz: { stats: {}, weak: [], rounds: [] }, practice: {}, story: { runs: 0, ratings: [] }, mocks: [] }; }
  var S = blank();
  try {
    var raw = localStorage.getItem(CONFIG.storageKey);
    if (raw) { var parsed = JSON.parse(raw); for (var k in parsed) S[k] = parsed[k]; }
  } catch (e) { storageOK = false; }
  function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); } catch (e) { storageOK = false; } }

  /* ---------------- speech ---------------- */
  var canSpeak = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  function speak(text) {
    if (!canSpeak) return;
    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text.replace(/\*\*|`/g, '')); u.rate = 0.95; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }
  function stopSpeaking() { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } }

  /* ---------------- countdown (timestamp based) ---------------- */
  var cleanups = [];
  function countdown(seconds, onTick, onEnd) {
    var end = Date.now() + seconds * 1000, done = false, iv;
    function tick() {
      var left = Math.max(0, end - Date.now());
      onTick(left);
      if (left <= 0 && !done) { finish(); onEnd(); }
    }
    function finish() { done = true; clearInterval(iv); document.removeEventListener('visibilitychange', tick); }
    iv = setInterval(tick, 250);
    document.addEventListener('visibilitychange', tick);
    tick();
    var api = { stop: function () { if (!done) finish(); }, running: function () { return !done; } };
    cleanups.push(api.stop);
    return api;
  }
  function timerHtml(id) { return '<div class="timer" id="' + id + '" role="timer" aria-label="Time left">' + mmss(CONFIG.answerSeconds * 1000) + '</div>'; }

  /* ---------------- shared bits ---------------- */
  function bar(frac, cls) { return '<div class="bar ' + (cls || '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(frac * 100) + '"><i style="width:' + (frac * 100).toFixed(1) + '%"></i></div>'; }
  function fillBars(root) { /* progress fill animates in after paint */ requestAnimationFrame(function () { $$('.bar > i', root).forEach(function (i) { var w = i.style.width; i.style.width = '0'; requestAnimationFrame(function () { i.style.width = w; }); }); }); }
  function emptyNote(what) { return '<div class="card muted">No ' + esc(what) + ' loaded yet. Add the content file and refresh.</div>'; }
  function lessonLink(id, text) { var l = byId(LEARN, id); return l ? '<a href="#/learn/' + esc(id) + '">' + esc(text || ('Open lesson: ' + l.title)) + '</a>' : ''; }

  /* =========================================================
     PAGES
     ========================================================= */
  var pages = {};
  var MODES = [
    { href: '#/learn', name: 'Learn', desc: 'Lessons from zero, in order. Start here.' },
    { href: '#/story', name: 'Story', desc: 'Your 90-second opening, in 3 stages.' },
    { href: '#/cards', name: 'Flashcards', desc: 'Short facts and numbers, spaced repetition.' },
    { href: '#/quiz', name: 'Quiz', desc: 'Four-option questions in rounds of 10.' },
    { href: '#/practice', name: 'Answer practice', desc: 'Answer exam questions out loud in 40 seconds.' },
    { href: '#/code', name: 'Code walkthrough', desc: 'Step through the notebook cells you will show.' },
    { href: '#/progress', name: 'Progress', desc: 'Counts, weakest items and Mock defence.' }
  ];

  function nextUp() {
    for (var i = 0; i < LEARN.length; i++) if (S.lessons[LEARN[i].id] !== 'got') return { href: '#/learn/' + LEARN[i].id, label: 'Next lesson: ' + LEARN[i].title };
    var due = CARDS.filter(function (c) { var s = S.cards[c.id]; return !s || s.box <= 2; }).length;
    if (due) return { href: '#/cards', label: 'Flashcards: ' + plural(due, 'card') + ' new or in box 1 to 2' };
    return { href: '#/practice', label: 'Answer practice' };
  }

  pages.home = function () {
    var nu = nextUp();
    var got = LEARN.filter(function (l) { return S.lessons[l.id] === 'got'; }).length;
    return {

          $('#sstart', root).hidden = true; $('#sstop', root).hidden = false;

  function storyRatingName(r) { return { word: 'Word for word', mostly: 'Mostly', lost: 'Lost it' }[r] || r; }

    gaps.forEach(function (g) {
      var from = 0, idx;
      while ((idx = text.indexOf(g, from)) >= 0) {
        var clash = marks.some(function (m) { return idx < m.e && idx + g.length > m.s; });
        if (!clash) { marks.push({ s: idx, e: idx + g.length }); break; }

      }
    });

    var out = '', pos = 0;

  }

  /* ---------------- FLASHCARDS ---------------- */
  var CAT_NAMES = { numbers: 'Numbers', models: 'Models', concepts: 'Concepts', prep: 'Preprocessing', at2: 'AT2', rules: 'Say-it rules' };

  }

        '<div class="chips" role="group" aria-label="Filter by topic">' + Object.keys(CAT_NAMES).map(function (k) { return '<button class="chip" data-cat="' + k + '" aria-pressed="' + !!cardFilter.cats[k] + '">' + CAT_NAMES[k] + '</button>'; }).join('') +

      }

  function filteredCards(lessonId) {
    if (lessonId) return CARDS.filter(function (c) { return c.lesson === lessonId; });

    return CARDS.filter(function (c) {

      return !cats.length || cats.indexOf(c.cat) >= 0;
    });
  }

  var sess = null;
  function newSession(lessonId) {
    sess = { key: lessonId || 'filter', lesson: lessonId, pool: filteredCards(lessonId), again: [], recent: [], newCount: 0, shown: 0, knew: 0, missed: 0, missedIds: {}, current: null, flipped: false, ended: false };
  }
  function drawCard() {
    var s = sess;
    s.again.forEach(function (a) { a.wait--; });
    for (var i = 0; i < s.again.length; i++) if (s.again[i].wait <= 0) { var id = s.again.splice(i, 1)[0].id; return byId(CARDS, id); }
    var waiting = s.again.map(function (a) { return a.id; });
    var cands = s.pool.filter(function (c) { return waiting.indexOf(c.id) < 0 && s.recent.indexOf(c.id) < 0; });
    if (!cands.length) cands = s.pool.filter(function (c) { return waiting.indexOf(c.id) < 0 && (!s.current || c.id !== s.current.id); });
    var weighted = [], total = 0;
    cands.forEach(function (c) {
      var b = cardBox(c.id), w;
      if (b === 0) { if (s.newCount >= CONFIG.newCardsPerSession) return; w = CONFIG.boxWeights[0]; }
      else w = CONFIG.boxWeights[b - 1];
      weighted.push([c, w]); total += w;

    if (!weighted.length) {
      if (s.again.length) { s.again.sort(function (a, b) { return a.wait - b.wait; }); return byId(CARDS, s.again.shift().id); }

    }
    var r = Math.random() * total;
    for (var j = 0; j < weighted.length; j++) { r -= weighted[j][1]; if (r <= 0) break; }

    if (cardBox(pick.id) === 0) s.newCount++;
    return pick;
  }
  function cardFront(c) {

        '</div></div>' +

  /* ---------------- ANSWER PRACTICE ---------------- */

  /* ---------------- CODE WALKTHROUGH ---------------- */
  var KW = /^(def|return|if|elif|else|for|in|not|and|or|import|from|as|lambda|True|False|None|with|while|is|continue|break|print)$/;
  function colourPy(line) {
    var out = '', re = /(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()|([A-Za-z_][A-Za-z0-9_]*)/g, last = 0, m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index));

      else if (m[2]) out += '<span class="tk-str">' + esc(m[2]) + '</span>';

      else if (m[5]) out += KW.test(m[5]) ? '<span class="tk-kw">' + esc(m[5]) + '</span>' : esc(m[5]);
      last = re.lastIndex;
    }
    return out + esc(line.slice(last));
  }

  function weakest() {

    QUIZ.forEach(function (x) { var s = S.quiz.stats[x.id]; if (s && S.quiz.weak.indexOf(x.id) >= 0) list.push({ score: 2 + s.wrong, label: 'Quiz missed: ' + x.q, href: x.lesson ? '#/learn/' + x.lesson : '#/quiz', lesson: x.lesson }); });
    PRACTICE.forEach(function (x) { if (ratingOf(x.id) === 'good') list.push({ score: 1, label: 'Practice only Good: ' + x.q, href: '#/practice/q/' + x.id, lesson: x.lesson }); });
    return list.sort(function (a, b) { return b.score - a.score; }).slice(0, 10);
  }
  pages.progress = function () {
    var got = LEARN.filter(function (l) { return S.lessons[l.id] === 'got'; }).length;
    var bc = boxCounts(CARDS);
    var counts = { excellent: 0, good: 0, missed: 0 };
    PRACTICE.forEach(function (x) { var r = ratingOf(x.id); if (r) counts[r]++; });
    var est = estimate(PRACTICE.map(function (x) { return ratingOf(x.id); }));
    var rounds = S.quiz.rounds.slice(-5).reverse();
    var w = weakest();
    return {
      title: 'Progress',
      html: '<h2>Progress</h2>' +
        '<h3>Lessons</h3><p>' + got + ' of ' + LEARN.length + ' marked "Got it".</p>' + bar(LEARN.length ? got / LEARN.length : 0) +
        '<h3>Flashcards per box</h3>' + table({ head: ['New', 'Box 1', 'Box 2', 'Box 3', 'Box 4', 'Box 5'], rows: [bc.map(String)] }) +
        '<h3>Last quiz scores</h3>' + (rounds.length ? table({ head: ['When', 'Set', 'Score'], rows: rounds.map(function (r) { return [new Date(r.at).toLocaleString(), POOLS[r.pool] || r.pool, r.score + ' / ' + r.n]; }) }) : '<p class="muted">No rounds yet.</p>') +
        '<h3>Answer practice ratings</h3><p>Excellent ' + counts.excellent + ' · Good ' + counts.good + ' · Missed ' + counts.missed + ' · Not tried ' + (PRACTICE.length - counts.excellent - counts.good - counts.missed) + '</p>' +
        (est != null ? '<div class="card"><p style="margin:0"><strong>Self-rated estimate: ' + est + ' / 40</strong></p><p class="small muted" style="margin:0">An estimate from your own ratings (Excellent ' + CONFIG.marksPerRating.excellent + ', Good ' + CONFIG.marksPerRating.good + ', Missed ' + CONFIG.marksPerRating.missed + '), averaged over rated questions. It is not a real mark.</p></div>' : '') +
        '<h3>Story</h3><p>' + (S.story.runs ? 'Practised from memory ' + plural(S.story.runs, 'time') + '. Last rating: ' + esc(storyRatingName(S.story.ratings[S.story.ratings.length - 1].r)) + '.' : 'Not practised from memory yet.') + '</p>' +
        '<h3>10 weakest items</h3>' + (w.length ? w.map(function (x) { return '<a class="listbtn" href="' + x.href + '"><span class="grow small">' + fmt(x.label) + '</span></a>' + (x.lesson && x.href.indexOf('#/learn/') !== 0 ? '<p class="small" style="margin:-4px 0 10px 4px">' + lessonLink(x.lesson) + '</p>' : ''); }).join('') : '<p class="muted">Nothing weak yet. Items appear here when you miss them.</p>') +
        '<h3>Mock defence</h3><p class="small muted">' + CONFIG.mockSize + ' random questions in a row, ' + CONFIG.answerSeconds + ' seconds each, no answers shown until the end.</p><a class="btn block-w" href="#/mock">Start Mock defence</a>' +
        (S.mocks.length ? '<p class="small muted" style="margin-top:8px">Last mock self-rated estimate: ' + S.mocks[S.mocks.length - 1].est + ' / 40 (estimate, not a real mark).</p>' : ''),
      after: fillBars
    };
  };

  var mock = null;
  pages.mock = function () {
    if (!PRACTICE.length) return { title: 'Mock defence', back: '#/progress', html: emptyNote('practice questions') };
    if (!mock) {
      return {
        title: 'Mock defence', back: '#/progress',
        html: '<h2>Mock defence</h2><p>' + CONFIG.mockSize + ' random questions. For each one, start the ' + CONFIG.answerSeconds + '-second timer and answer out loud. No answers are shown until all ' + CONFIG.mockSize + ' are done. Then you review each one and rate yourself.</p>' +
          '<button class="btn block-w" id="mstart">Start</button>',
        after: function (root) { $('#mstart', root).onclick = function () { mock = { qs: shuffle(PRACTICE).slice(0, CONFIG.mockSize).map(function (x) { return x.id; }), i: 0, phase: 'ask', ratings: {} }; render(); }; }
      };
    }
    var m = mock;
    if (m.phase === 'ask') {
      var x = byId(PRACTICE, m.qs[m.i]);
      return {
        title: 'Mock ' + (m.i + 1) + ' of ' + m.qs.length,
        html: bar(m.i / m.qs.length) + '<div class="kicker">Question ' + (m.i + 1) + ' of ' + m.qs.length + '</div>' +
          '<div class="card"><p style="font-size:21px;font-weight:600;line-height:1.35;margin:0">' + fmt(x.q) + '</p></div>' +
          '<div class="card">' + timerHtml('mtimer') + '<div class="row"><button class="btn" id="mgo">Start ' + CONFIG.answerSeconds + ' seconds</button><button class="btn plain" id="mstop" hidden>Stop</button></div></div>' +
          '<button class="btn block-w" id="mnext" hidden>' + (m.i + 1 < m.qs.length ? 'Next question' : 'Go to review') + '</button>' +
          '<button class="btn plain block-w" id="mquit" style="margin-top:8px">Stop the mock</button>',
        after: function (root) {
          fillBars(root);
          var el = $('#mtimer', root), t = null;
          function done() { if (t) t.stop(); $('#mgo', root).hidden = true; $('#mstop', root).hidden = true; $('#mnext', root).hidden = false; $('#mnext', root).focus(); }
          $('#mgo', root).onclick = function () { $('#mgo', root).hidden = true; $('#mstop', root).hidden = false; t = countdown(CONFIG.answerSeconds, function (left) { el.textContent = mmss(left); el.classList.toggle('low', left < 10000); }, done); };
          $('#mstop', root).onclick = done;
          $('#mnext', root).onclick = function () { m.i++; if (m.i >= m.qs.length) { m.phase = 'review'; m.i = 0; } render(); };
          $('#mquit', root).onclick = function () { if (confirm('Stop this mock? Nothing from it will be saved.')) { mock = null; render(); } };
        }
      };
    }
    if (m.phase === 'review') {
      var y = byId(PRACTICE, m.qs[m.i]);
      return {
        title: 'Review ' + (m.i + 1) + ' of ' + m.qs.length,
        html: '<div class="kicker">Review ' + (m.i + 1) + ' of ' + m.qs.length + '</div><div class="card"><p style="font-size:20px;font-weight:600;margin:0">' + fmt(y.q) + '</p></div>' + revealHtml(y),
        after: function (root) {
          mountReveal(root, y, function (rating) {
            m.ratings[y.id] = rating; S.practice[y.id] = { rating: rating, at: Date.now() }; save(); stopSpeaking();
            m.i++; if (m.i >= m.qs.length) { m.phase = 'done'; var e = estimate(m.qs.map(function (id) { return m.ratings[id]; })); S.mocks.push({ at: Date.now(), est: e, ratings: m.ratings }); save(); }
            render();
          });
        }
      };
    }
    var c = { excellent: 0, good: 0, missed: 0 };
    m.qs.forEach(function (id) { c[m.ratings[id]]++; });
    var est = estimate(m.qs.map(function (id) { return m.ratings[id]; }));
    return {
      title: 'Mock finished', back: '#/progress',
      html: '<h2>Mock finished</h2><div class="card"><p>Excellent ' + c.excellent + ' · Good ' + c.good + ' · Missed ' + c.missed + '</p><p><strong>Self-rated estimate: ' + est + ' / 40</strong></p><p class="small muted" style="margin:0">This is an estimate from your own ratings. It is not a real mark.</p></div>' +
        (c.missed ? '<h3>Missed</h3>' + m.qs.filter(function (id) { return m.ratings[id] === 'missed'; }).map(function (id) { var z = byId(PRACTICE, id); return '<a class="listbtn" href="#/practice/q/' + esc(id) + '"><span class="grow">' + fmt(z.q) + '</span></a>'; }).join('') : '') +
        '<div class="row"><button class="btn" id="mnew">New mock</button><a class="btn plain" href="#/progress">Progress</a></div>',
      after: function (root) { $('#mnew', root).onclick = function () { mock = null; render(); }; }
    };
  };

  pages.notFound = function () { return { title: 'Not found', back: '#/', html: '<p>That page does not exist. <a href="#/">Go home</a>.</p>' }; };

  /* =========================================================
     ROUTER
     ========================================================= */
  var NAV = [['#/', 'Home', 'home'], ['#/learn', 'Learn', 'learn'], ['#/story', 'Story', 'story', true], ['#/cards', 'Cards', 'cards'], ['#/quiz', 'Quiz', 'quiz'], ['#/practice', 'Practice', 'practice'], ['#/code', 'Code', 'code', true], ['#/progress', 'Progress', 'progress', true]];
  $('#nav').innerHTML = '<span class="brand">AT3 Defence Study</span>' + NAV.map(function (n) { return '<a href="' + n[0] + '" data-tab="' + n[2] + '"' + (n[3] ? ' class="side-only"' : '') + '>' + n[1] + '</a>'; }).join('');

  function parse() {
    var h = location.hash.replace(/^#\/?/, '');
    var qi = h.indexOf('?'), path = qi >= 0 ? h.slice(0, qi) : h, qs = qi >= 0 ? h.slice(qi + 1) : '';
    var q = {}; qs.split('&').filter(Boolean).forEach(function (kv) { var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
    return { parts: path.split('/').filter(Boolean), q: q, key: h };
  }
  function route(r) {
    var a = r.parts[0], b = r.parts[1], c = r.parts[2];
    if (!a) return [pages.home(), 'home'];
    if (a === 'learn') return [b ? pages.lesson(b) : pages.learn(), 'learn'];
    if (a === 'glossary') return [pages.glossary(), 'learn'];
    if (a === 'story') return [pages.story(), 'story'];
    if (a === 'cards') return [b === 'session' ? pages.cardSession(r.q) : pages.cards(), 'cards'];
    if (a === 'quiz') return [b === 'run' ? pages.quizRun(r.q) : pages.quiz(), 'quiz'];
    if (a === 'practice') return [b === 'q' && c ? pages.practiceOne(c, r.q) : pages.practice(), 'practice'];
    if (a === 'code') return [b ? pages.codeStep(b) : pages.codeIndex(), 'code'];
    if (a === 'progress') return [pages.progress(), 'progress'];
    if (a === 'mock') return [pages.mock(), 'progress'];
    return [pages.notFound(), ''];
  }
  var lastKey = null;
  function render() {
    cleanups.forEach(function (f) { try { f(); } catch (e) { /* ignore */ } }); cleanups = [];
    var r = parse();
    if (r.key !== lastKey) {
      stopSpeaking();
      // leaving a mode resets its in-memory session
      if (r.parts[0] !== 'cards') sess = null;
      if (r.parts[0] !== 'quiz') round = null;
      if (r.parts[0] !== 'mock') mock = null;
      if (r.parts[0] !== 'practice') pq = null;
    }
    var res = route(r), page = res[0], tab = res[1];
    document.title = (page.title ? page.title + ' · ' : '') + 'AT3 Defence Study';
    $('#title').textContent = page.title || '';
    var back = $('#back');
    back.hidden = !page.back;
    back.onclick = page.back ? function () { location.hash = page.back; } : null;
    var main = $('#main');
    main.innerHTML = page.html;
    $$('#nav a').forEach(function (n) { if (n.getAttribute('data-tab') === tab) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current'); });
    if (r.key !== lastKey) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
    lastKey = r.key;
    if (page.after) page.after(main);
  }
  window.addEventListener('hashchange', render);
  render();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support is optional */ });
  }
})();
</script>
</body>
</html>
